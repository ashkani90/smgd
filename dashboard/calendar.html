    .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
    }

    .modal-content {
        background-color: white;
        border-radius: 10px;
        width: 90%;
        max-width: 600px;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }

    .modal-header {
        padding: 15px 20px;
        border-bottom: 1px solid #e0e0e0;
        display: flex;

        align-items: center;
    }

    .modal-header h3 {

    }

    .modal-body {
        padding: 20px;
    }

    .modal-footer {

    }

        display: flex;
        gap: 15px;
        margin-bottom: 15px;
    }

    .form-group {
        margin-bottom: 15px;

    }

    .form-group label {

/* calendar.css */
.calendar-container {
    font-family: 'Vazir', sans-serif;
    direction: rtl;
}

.calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    background-color: #f8f9fa;
    border-radius: 10px;
    margin-bottom: 20px;
}

.calendar-header h2 {
    margin: 0;
    color: #333;
}

.calendar-header button {
    background-color: #007bff;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
}

.calendar-header button:hover {
    background-color: #0056b3;
}

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
    background-color: #e0e0e0;
    border: 1px solid #e0e0e0;
}

.day-header {
    background-color: #4a6baf;
    color: white;
    padding: 15px;
    text-align: center;
    font-weight: bold;
}

.day {
    background-color: white;
    min-height: 120px;
    padding: 10px;
    position: relative;
    border: 1px solid #f0f0f0;
}

.day.empty {
    background-color: #f9f9f9;
}

.day.has-events {
    background-color: #f0f8ff;
}

.day-number {
    font-size: 14px;
    font-weight: bold;
    color: #333;
    margin-bottom: 5px;
}

.calendar-event {
    font-size: 12px;
    padding: 3px 6px;
    margin-bottom: 3px;
    border-radius: 3px;
    color: white;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.calendar-event:hover {
    opacity: 0.9;
}

    <script>
        // 1. اجرای فوری: قبل از هر چیزی چک کن آیا پین است؟
        // اگر بله، کلاس را به بادی اضافه کن تا CSS فوراً اعمال شود
        (function() {
            const isPinned = localStorage.getItem('sidebarPinned') === 'true';
            if (isPinned) {
                document.body.classList.add('sidebar-pinned');
            }
        })();

        // تابع تزریق HTML
        function injectSidebarHTML(html) {
            const container = document.getElementById('sidebar-container');
            if (container.querySelector('.sidebar')) return;

            container.innerHTML = html;
            executeSidebarScript();
        }

        function loadSidebar() {
            // 2. تلاش برای خواندن از کش (سرعت بالا)
            const cachedHTML = localStorage.getItem('sidebarHTML_Cache');
            if (cachedHTML) {
                injectSidebarHTML(cachedHTML);
            }

            // 3. دانلود در پس‌زمینه برای آپدیت
            fetch('../sidebar/sidebar.html?v=' + Date.now())
                .then(response => response.text())
                .then(html => {
                    // اگر کش نبود، الان نمایش بده
                    if (!cachedHTML) {
                        injectSidebarHTML(html);
                    }
                    // آپدیت کش
                    if (html !== cachedHTML) {
                        localStorage.setItem('sidebarHTML_Cache', html);
                    }
                })
                .catch(console.error);
        }
        
        function executeSidebarScript() {
            const existingScript = document.querySelector('script[src*="../sidebar/sidebar.js"]');
            if (existingScript) existingScript.remove();
            
            const script = document.createElement('script');
            script.src = '../sidebar/sidebar.js?v=' + Date.now();
            script.async = false;
            document.body.appendChild(script);
        }
        
        // اجرا
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadSidebar);
        } else {
            loadSidebar();
        }
    </script>

    <script src="../components/pages-header/header.js"></script>
    <!-- اسکریپت فوتر -->
    <script src="../components/pages-footer/footer.js"></script>





    <!-- اسکریپت‌های اختصاصی صفحه تقویم -->    
    <script>

        // مدیریت تغییر تاریخ
        document.getElementById('goDate').addEventListener('click', function() {
            const year = document.getElementById('yearSelect').value;
            const month = document.getElementById('monthSelect').value;
            
            // تغییر تاریخ در FullCalendar
            if (window.calendar) {
                calendar.gotoDate(new Date(year, month - 1, 1));
                calendar.refetchEvents();
            }
        });

        // تنظیم تاریخ پیش‌فرض
        document.addEventListener('DOMContentLoaded', function() {
            // تنظیم سال و ماه فعلی
            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth() + 1;
            
            const yearSelect = document.getElementById('yearSelectGregorian');
            const monthSelect = document.getElementById('monthSelectGregorian');
            
            if (yearSelect) {
                yearSelect.value = year;
            }
            if (monthSelect) {
                monthSelect.value = month;
            }
        });


        // تابع برای بارگذاری رویدادهای امروز
        async function loadTodayEvents() {
            try {
                const today = new Date();
                const month = today.getMonth() + 1;
                const year = today.getFullYear();
                
                const response = await fetch(`../api/get_calendar_events.php?month=${month}&year=${year}`);
                const data = await response.json();
                
                if (data.success) {
                    const todayEvents = data.events.filter(event => {
                        const eventDate = event.start.split('T')[0];
                        const todayStr = today.toISOString().split('T')[0];
                        return eventDate === todayStr;
                    });
                    
                    renderTodayEvents(todayEvents);
                }
            } catch (error) {
                console.error('خطا در دریافت رویدادهای امروز:', error);
            }
        }

        function renderTodayEvents(events) {
            const container = document.getElementById('todayEventsList');
            if (!container) return;
            
            if (events.length === 0) {
                container.innerHTML = '<p class="no-events">رویدادی برای امروز وجود ندارد</p>';
                return;
            }
            
            container.innerHTML = events.map(event => `
                <div class="event-item ${event.type}">
                    <div class="event-title">${event.title}</div>
                    <div class="event-time">
                        <i class="far fa-clock"></i>
                        ${event.allDay ? 'تمام روز' : event.start.split('T')[1]}
                    </div>
                </div>
            `).join('');
        }


        // نمایش پیش‌نمایش رنگ
        document.getElementById('eventColor').addEventListener('input', function(e) {
            document.getElementById('colorPreview').style.backgroundColor = e.target.value;
        });

    </script>
