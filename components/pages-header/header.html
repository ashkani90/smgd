<style>
    /* شروع استایل‌های اعلان‌های هوشمند */
.notification-bell-container {
    position: relative;
    margin-left: 20px;
}

.notification-bell {
    position: relative;
    cursor: pointer;
    padding: 8px;
    border-radius: 50%;
    transition: background-color 0.3s;
    font-size: 1.2rem;
    color: #555;
}

.notification-bell:hover {
    background-color: rgba(0, 0, 0, 0.05);
}

.notification-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    background-color: #e74c3c;
    color: white;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    font-size: 0.7rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.notification-dropdown {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    width: 350px;
    background: white;
    border-radius: 8px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    z-index: 1000;
    margin-top: 10px;
    max-height: 500px;
    overflow: hidden;
}

.notification-dropdown.show {
    display: block;
    animation: slideDown 0.3s ease-out;
}

@keyframes slideDown {
    from {
        opacity: 0;
        transform: translateY(-10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.notification-dropdown-header {
    padding: 15px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f8f9fa;
}

.notification-dropdown-header h3 {
    margin: 0;
    font-size: 1rem;
    color: #2c3e50;
}

.mark-all-read-btn,
.refresh-notifications-btn {
    background: #3498db;
    color: white;
    border: none;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: background-color 0.3s;
}

.mark-all-read-btn:hover,
.refresh-notifications-btn:hover {
    background: #2980b9;
}

.refresh-notifications-btn {
    background: transparent;
    color: #7f8c8d;
    padding: 5px;
    font-size: 0.9rem;
}

.notification-dropdown-content {
    max-height: 400px;
    overflow-y: auto;
}

.notification-dropdown-item {
    padding: 12px 15px;
    border-bottom: 1px solid #f5f5f5;
    display: flex;
    align-items: flex-start;
    cursor: pointer;
    transition: background-color 0.2s;
}

.notification-dropdown-item:hover {
    background-color: #f8f9fa;
}

.notification-dropdown-item.unread {
    background-color: #f0f8ff;
}

.notification-dropdown-item-icon {
    margin-left: 10px;
    color: #3498db;
    font-size: 1.2rem;
    margin-top: 2px;
}

.notification-dropdown-item-content {
    flex: 1;
}

.notification-dropdown-item-title {
    font-weight: 600;
    color: #2c3e50;
    margin-bottom: 5px;
    font-size: 0.9rem;
}

.notification-dropdown-item-message {
    color: #555;
    font-size: 0.85rem;
    line-height: 1.4;
    margin-bottom: 8px;
}

.notification-dropdown-item-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.75rem;
    color: #7f8c8d;
}

.notification-time {
    display: flex;
    align-items: center;
    gap: 5px;
}

.notification-priority {
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 0.7rem;
    font-weight: bold;
}

.priority-critical {
    background-color: #ffebee;
    color: #d32f2f;
}

.priority-high {
    background-color: #fff3e0;
    color: #f57c00;
}

.priority-medium {
    background-color: #e3f2fd;
    color: #1976d2;
}

.priority-low {
    background-color: #e8f5e8;
    color: #388e3c;
}

.notification-mark-read-btn {
    background: none;
    border: none;
    color: #95a5a6;
    cursor: pointer;
    font-size: 1rem;
    padding: 5px;
    opacity: 0;
    transition: opacity 0.3s, color 0.3s;
}

.notification-dropdown-item:hover .notification-mark-read-btn {
    opacity: 1;
}

.notification-mark-read-btn:hover {
    color: #27ae60;
}

.notification-dropdown-footer {
    padding: 12px 15px;
    border-top: 1px solid #eee;
    text-align: center;
}

.view-all-notifications {
    color: #3498db;
    text-decoration: none;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.view-all-notifications:hover {
    text-decoration: underline;
}

.no-notifications {
    text-align: center;
    padding: 40px 20px;
    color: #7f8c8d;
}

.no-notifications i {
    font-size: 2.5rem;
    margin-bottom: 15px;
    display: block;
    opacity: 0.5;
}

.no-notifications p {
    margin: 0;
}

/* استایل desktop alerts */
.desktop-alert {
    position: fixed;
    top: 20px;
    right: 20px;
    background-color: #3498db;
    color: white;
    padding: 15px 20px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-width: 300px;
    max-width: 400px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    z-index: 10000;
    animation: slideInRight 0.3s ease-out;
}

@keyframes slideInRight {
    from {
        opacity: 0;
        transform: translateX(100%);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

.desktop-alert-content {
    display: flex;
    align-items: center;
    flex: 1;
    gap: 10px;
}

.desktop-alert-close {
    background: none;
    border: none;
    color: white;
    cursor: pointer;
    font-size: 1rem;
    margin-right: 5px;
}

.desktop-alert-critical {
    background-color: #e74c3c;
}

.desktop-alert-high {
    background-color: #e67e22;
}

.desktop-alert-medium {
    background-color: #3498db;
}

.desktop-alert-low {
    background-color: #2ecc71;
}
